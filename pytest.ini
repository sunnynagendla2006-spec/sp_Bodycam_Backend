[pytest]
markers =
    postgres_integration: requires a live, reachable PostgreSQL instance (set TEST_DATABASE_URL). Skipped automatically when unavailable -- see tests/test_evidence_verification_concurrency.py for exact setup instructions.
    postgres_migration: requires a live, reachable PostgreSQL instance (set TEST_DATABASE_URL). Exercises the real Alembic migration chain against disposable databases it creates and drops itself. Skipped automatically when unavailable -- see tests/test_migrations_postgres.py for exact setup instructions.
